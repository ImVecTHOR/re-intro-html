<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Conteúdo sobre o uso de aplicações de iframes no HTML.">

    <title>Sobre Iframes | HTML</title>
</head>

<body>
    <h1>O qe é um Iframe? </h1>
    <p> iframe significa <strong> inline frame </strong> . </p>
    <p> Ele permite que você <em> incorpore </em> outra página/documento dentro da sua própria página HTML. </p>

    <hr>

    <h2> Criando um iframe básico </h2>
    <iframe src="03-listas.html" frameborder="0" width="500" height="600"></iframe>

    <hr>
    <h2> Explorando outras formas de trabalhar com o iframe</h2>
    <h3> Incorporando o Youtube </h3>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/J635mqk769k?si=5jIyIYhDtUK8QckV"
        title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; 
        web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <h3>
        Incorporando um mapa no site
    </h3>
    <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d5171.489874271442!2d-46.629558116506125!3d-23.5758581828806!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce5979b975c919%3A0x3ed5565d7bb0669e!2sCachorr%C3%B3dromo%20Parque%20da%20Aclimacao!5e0!3m2!1spt-BR!2sbr!4v1790213250878!5m2!1spt-BR!2sbr"
        width="400" 
        height="300" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
</body>

</html>
